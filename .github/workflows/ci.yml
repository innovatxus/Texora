name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Emulator-targeted defaults; no secrets are needed for CI builds.
      - run: cp .env.example .env.local

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run contrast:check
      - run: npm run rules:check
      - run: npm run test

      # Firestore rules matrix and server integration tests run on the emulators.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm run test:rules
      - run: npm run test:integration

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npx playwright install --with-deps chromium
      # Catalog pages prerender from Firestore, so build and e2e run against
      # freshly seeded emulators. Visual baselines are per-OS: linux ones come
      # from visual-baselines.yml, and the step below runs once they exist.
      - run: >
          npx firebase emulators:exec --only firestore,auth --project demo-texora
          "npm run seed && npm run build && npm run e2e -- --grep-invert @visual"
      - if: hashFiles('e2e/__screenshots__/linux/**') != ''
        run: npm run e2e:visual

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
