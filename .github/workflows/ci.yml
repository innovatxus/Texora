name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Emulator-targeted defaults; no secrets are needed for CI builds.
      - run: cp .env.example .env.local

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run contrast:check
      - run: npm run test

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm run build

      - run: npx playwright install --with-deps chromium
      # Visual baselines are per-OS; linux ones come from visual-baselines.yml.
      # Once e2e/__screenshots__/linux exists, the visual suite runs here too.
      - run: npm run e2e -- --grep-invert @visual
      - if: hashFiles('e2e/__screenshots__/linux/**') != ''
        run: npm run e2e:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
